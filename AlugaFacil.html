  <style>/* AlugaFácil: design tokens e componentes base (v1, nov/2026)
   Fonte: telas do Claude Design. Copiar para o style.css do app (ou importar antes dele).
   Fontes: <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"> */

:root {
  /* Marca */
  --af-verde: #0E7C5A;          /* cor principal: botões, aba ativa, links */
  --af-verde-escuro: #0A5E44;   /* hover/pressionado */
  --af-verde-texto: #0B6B4E;    /* texto verde sobre fundo claro */
  --af-verde-claro: #E3F2EC;    /* fundo de ícones, botão secundário verde */
  --af-menta: #6EE7B7;          /* destaque sobre fundo verde/escuro */
  --af-tinta: #16201C;          /* texto principal */
  --af-areia: #F6F3EC;          /* fundo do app */
  --af-branco: #FFFFFF;         /* cartões */

  /* Neutros */
  --af-texto-2: #5A6460;        /* texto secundário (contraste ≥ 4.5:1 em branco e areia) */
  --af-texto-3: #3D4A45;
  --af-borda-campo: #8A938F;    /* borda de input/botão secundário (≥ 3:1) */
  --af-borda-suave: #E4E0D6;    /* bordas decorativas */
  --af-divisor: #EFECE4;        /* linhas entre itens de lista */
  --af-trilho: #ECE8DE;         /* fundo de segmented control */

  /* Situações */
  --af-pago-txt: #0B6B4E;    --af-pago-bg: #DDF3EA;
  --af-atraso-txt: #A6361C;  --af-atraso-bg: #FCE7E1;  --af-atraso-ponto: #C2410C;
  --af-avencer-txt: #3D4A45; --af-avencer-bg: #ECEAE3; --af-avencer-ponto: #8A938F;
  --af-aviso-txt: #6B3A0A;   --af-aviso-bg: #FFF4E5;

  /* Tipografia */
  --af-font-titulo: "Outfit", system-ui, sans-serif;
  --af-font-texto: "Inter", system-ui, sans-serif;
  --af-h1: 600 27px/1.2 var(--af-font-titulo);      /* título de tela */
  --af-h1-sub: 600 24px/1.2 var(--af-font-titulo);  /* título de subtela/formulário */
  --af-h2: 600 18px/1.3 var(--af-font-titulo);
  --af-valor-grande: 600 32px/1.1 var(--af-font-titulo);
  --af-valor: 600 21px/1.2 var(--af-font-titulo);
  --af-corpo: 400 15px/1.45 var(--af-font-texto);
  --af-pequeno: 400 13px/1.4 var(--af-font-texto);
  --af-rotulo-secao: 600 13px/1.3 var(--af-font-texto); /* + uppercase, letter-spacing .06em */

  /* Espaços e raios */
  --af-pad-tela: 16px 20px 20px;
  --af-gap-secao: 16px;
  --af-raio-cartao: 16px;
  --af-raio-destaque: 20px;
  --af-raio-campo: 12px;
  --af-raio-botao-grande: 14px;
  --af-alvo-min: 44px;          /* área mínima de toque */
  --af-tabbar-altura: 84px;
}

/* ---------- Componentes base ---------- */
body { margin: 0; background: var(--af-areia); color: var(--af-tinta); font: var(--af-corpo); }
a { color: var(--af-verde); } a:hover { color: var(--af-verde-escuro); }

.af-card { background: var(--af-branco); border-radius: var(--af-raio-cartao); padding: 14px 16px; }
.af-destaque { background: var(--af-verde); color: #fff; border-radius: var(--af-raio-destaque); padding: 20px; }
.af-secao-rotulo { font: var(--af-rotulo-secao); text-transform: uppercase; letter-spacing: .06em; color: var(--af-texto-2); margin: 0; }

.af-btn { min-height: var(--af-alvo-min); border-radius: var(--af-raio-campo); padding: 0 16px; font: 600 14px var(--af-font-texto);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; cursor: pointer; border: 0; }
.af-btn--primario { background: var(--af-verde); color: #fff; }
.af-btn--primario:hover { background: var(--af-verde-escuro); color: #fff; }
.af-btn--secundario { background: #fff; color: var(--af-tinta); border: 1px solid var(--af-borda-campo); }
.af-btn--suave { background: var(--af-verde-claro); color: var(--af-verde-texto); }
.af-btn--grande { height: 54px; width: 100%; border-radius: var(--af-raio-botao-grande); font-size: 16px; }

.af-chip { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--af-borda-campo); background: #fff;
  color: var(--af-tinta); font: 500 13px var(--af-font-texto); white-space: nowrap; flex-shrink: 0; }
.af-chip[aria-pressed="true"] { background: var(--af-verde); border-color: var(--af-verde); color: #fff; font-weight: 600; }

.af-badge { font: 600 12px var(--af-font-texto); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.af-badge--pago { color: var(--af-pago-txt); background: var(--af-pago-bg); }
.af-badge--atraso { color: var(--af-atraso-txt); background: var(--af-atraso-bg); }
.af-badge--avencer { color: var(--af-avencer-txt); background: var(--af-avencer-bg); }

.af-campo { display: flex; flex-direction: column; gap: 6px; }
.af-campo label, .af-campo legend { font: 600 14px var(--af-font-texto); }
.af-campo input, .af-campo select, .af-campo textarea { box-sizing: border-box; width: 100%; min-height: 48px; border-radius: var(--af-raio-campo);
  border: 1px solid var(--af-borda-campo); background: #fff; padding: 0 14px; font: 400 15px var(--af-font-texto); color: var(--af-tinta); }
.af-campo input:focus-visible, .af-campo select:focus-visible, .af-btn:focus-visible, .af-chip:focus-visible { outline: 3px solid var(--af-menta); outline-offset: 2px; }
.af-campo .af-ajuda { font: var(--af-pequeno); color: var(--af-texto-2); }

.af-valor { white-space: nowrap; flex-shrink: 0; font-weight: 600; } /* valores em R$ nunca quebram linha */

/* Barra inferior (celular) */
.af-tabbar { position: fixed; inset: auto 0 0 0; height: var(--af-tabbar-altura); box-sizing: border-box; background: #fff;
  border-top: 1px solid var(--af-borda-suave); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
.af-tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--af-texto-2); font: 500 11px var(--af-font-texto); }
.af-tabbar a .af-tab-icone { width: 52px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.af-tabbar a[aria-current="page"] { color: var(--af-verde); font-weight: 600; }
.af-tabbar a[aria-current="page"] .af-tab-icone { background: var(--af-pago-bg); }
@media (min-width: 900px) { .af-tabbar { display: none; } } /* no desktop, manter a barra lateral (aside) já existente */
</style>

body.landing{background:var(--af-areia)}

@media(prefers-reduced-motion:no-preference){

 /* Cortina nas fotos grandes */
 .lp-anim [data-reveal="curtain"]{opacity:1;translate:0 0}
 .lp-anim [data-reveal="curtain"] .lp-frame{clip-path:inset(12% 8% 12% 8% round 24px);transition:clip-path 1.2s cubic-bezier(.22,1,.36,1) var(--d,0ms)}
 .lp-anim [data-reveal="curtain"].is-in .lp-frame{clip-path:inset(0 0 0 0 round 24px)}

 /* Título palavra por palavra */
 .lp-anim .lp-split .lp-word{display:inline-block;opacity:0;translate:0 .45em;transition:opacity .7s cubic-bezier(.22,1,.36,1),translate .8s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i)*55ms + 80ms)}
 .lp-anim .lp-split.is-in .lp-word{opacity:1;translate:0 0}

 .lp-anim .is-in .lp-float{opacity:1;translate:0 0;scale:1;animation:lpBob 6s ease-in-out 1.6s infinite}
 .lp-anim .lp-float--hero{transition-delay:.9s}
 .lp-anim .lp-pill{opacity:0;scale:.6;transition:opacity .4s ease 1.1s,scale .5s cubic-bezier(.34,1.6,.64,1) 1.1s}
 .lp-anim .is-in .lp-pill{opacity:1;scale:1}

  <script type="module">const blank=()=>({properties:[],people:[],leases:[],payments:[],jobs:[],expenses:[]});
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());
const current=()=>today().slice(0,7);
function shift(month,n){const [y,m]=month.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.toISOString().slice(0,7)}
function charges(db,month){
 return db.leases.flatMap(l=>{
  const [year,m]=month.split('-').map(Number);
  const due=month+'-'+String(Math.min(l.day,new Date(Date.UTC(year,m,0)).getUTCDate())).padStart(2,'0');
  if(due<l.start||due>l.end)return [];
  const key=l.id+'/'+month, paid=db.payments.find(p=>p.key===key);
  return [{...l,key,due,paid,status:paid?'Pago':due<today()?'Em atraso':'A vencer',property:db.properties.find(p=>p.id===l.property),person:db.people.find(p=>p.id===l.person)}];
 }).sort((a,b)=>a.due.localeCompare(b.due));
}
function cash(db,month){
 const sum=xs=>xs.reduce((v,x)=>v+x.amount,0);
 return {income:sum(db.payments.filter(p=>p.date.startsWith(month))),cost:sum(db.expenses.filter(e=>e.date.startsWith(month)))};

function remember(s){auth=s; if(s)sessionStorage.setItem('af.cloud.session',JSON.stringify(s));else sessionStorage.removeItem('af.cloud.session')}
async function api(path,options={},token){
 const res=await fetch(endpoint+path,{...options,headers:{apikey:publicKey,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers}});
 const text=await res.text();const result=text?JSON.parse(text):null;
 if(!res.ok)throw Error(result?.message||result?.msg||result?.error_description||'Erro ao acessar o Supabase.');
 return result;
}
async function login(email,password){remember(await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})}))}
async function token(){
 if(!auth)throw Error('Entre com sua conta do Aluguel Fácil.');
 if(auth.expires_at*1000<Date.now()+60000){
 renewing??=api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:auth.refresh_token})}).then(remember).finally(()=>renewing=null);
 await renewing;
 }
 return auth.access_token;
}
async function listRows(table,query,order='id'){
 const all=[];let offset=0;while(true){
 const rows=await api('/rest/v1/'+table+'?'+query+'&order='+order+'&offset='+offset+'&limit=200',{},await token());
 all.push(...rows);if(rows.length<200)return all;offset+=rows.length;
 }
}

async function writeOnline(t,type,id,f,db,month){
 const post=async(path,body)=>api('/rest/v1/'+path,{method:'POST',body:JSON.stringify(body)},await token());
 switch(type){
 case 'property':return post('rpc/af_add_property',{t,n:f.name,k:Object.keys(types).find(k=>types[k]===f.type)||'other',addr:f.address,pid:crypto.randomUUID()});
 case 'person':{let phone=f.phone.replace(/\D/g,'');if(phone.length>11&&phone.startsWith('55'))phone=phone.slice(2);return post('renters',{tenant_id:t,name:f.name,phone:phone||null})}
 case 'lease':return post('rental_contracts',{tenant_id:t,unit_id:f.unit,renter_id:f.person,start_date:f.start,end_date:f.end,monthly_rent:f.amount/100,due_day:+f.day,status:'active'});
 case 'pay':{const c=charges(db,month).find(c=>c.key===id&&!c.paid);if(!c)throw Error('Cobrança indisponível.');return post('af_payments',{tenant_id:t,contract_id:c.id,period:month+'-01',received:f.date,cents:c.amount})}
 case 'job':return post('af_jobs',{tenant_id:t,property_id:f.property,name:f.name,scheduled:f.date});
 case 'finish':return post('rpc/af_finish_job',{t,j:id,dt:f.date,cost:f.amount});
 case 'expense':return post('af_expenses',{tenant_id:t,name:f.name,paid:f.date,cents:f.amount});
 default:throw Error('Operação desconhecida.');
 }
}

function lpAnimate(){

 h1.innerHTML=h1.textContent.trim().split(/\s+/).map((w,i)=>'<span class="lp-word" style="--i:'+i+'">'+w+'</span>').join(' ');

 const showCount=(el,v)=>el.textContent=money(v);

 const nav=root.querySelector('.lp-navbar'),bar=root.querySelector('.lp-progress i');
 const els=[...root.querySelectorAll('[data-reveal]'),h1];
 if(reduce||!('IntersectionObserver' in window)){
  els.forEach(e=>e.classList.add('is-in'));
  const onScrollStatic=()=>nav.classList.toggle('is-stuck',scrollY>8);
  addEventListener('scroll',onScrollStatic,{passive:true});
  lpAnimate.stop=()=>removeEventListener('scroll',onScrollStatic);

 }

const pfEl=()=>$('#form');
function pfGo(n){
 pfStep=n;pfSeen=Math.max(pfSeen,n);
 pfEl().querySelectorAll('.pf-step').forEach(s=>s.hidden=+s.dataset.step!==n);
 pfEl().querySelectorAll('[data-pf-go]').forEach(b=>{const i=+b.dataset.pfGo;b.disabled=i>pfSeen;b.setAttribute('aria-current',i===n?'step':'false');b.parentNode.classList.toggle('is-done',i<n)});
 pfEl().querySelector('[data-pf-back]').hidden=!n;pfEl().querySelector('.pf-next').textContent=n===2?'Salvar imóvel':'Continuar';
 $('#error').textContent='';$('dialog').scrollTop=0;
 pfEl().querySelector('.pf-step:not([hidden]) input:not([type=hidden]):not([type=file]):not([type=checkbox])')?.focus({preventScroll:true});
}
function pfCheck(n){
 const step=pfEl().querySelector('.pf-step[data-step="'+n+'"]');
 for(const el of step.querySelectorAll('input,select')){
  if(el.type==='text')el.value=el.value.trim();
  if(!el.checkValidity()){if(pfStep!==n)pfGo(n);el.reportValidity();if(el.type!=='radio')el.focus();return false}
 }
 return true;
}
const pfCents=v=>Math.round((Number(v)||0)*100);
function pfTotals(){
 const f=pfEl();if(!f.querySelector('#pf-total'))return;
 const E=f.elements,rent=pfCents(E.rent.value),condo=pfCents(E.condo.value),iptu=Math.round(pfCents(E.iptu.value)/12),tenant=f.querySelector('[name=payer]:checked')?.value!=='Locador';
 $('#pf-iptu-m').textContent=iptu?'≈ '+money(iptu)+' por mês':'';
 const parts=[['Aluguel',rent],...(tenant?[['condomínio',condo],['IPTU',iptu]]:[])].filter(([,v],i)=>!i||v);
 $('#pf-total').textContent=money(parts.reduce((n,[,v])=>n+v,0));
 $('#pf-total-d').textContent=parts.map(([l])=>l).join(' + ')+(!tenant&&(condo||iptu)?' · condomínio e IPTU por conta do locador':'');
}
// Busca do endereço pelo CEP (ViaCEP, com BrasilAPI de reserva). Só preenche campos vazios ou que vieram da busca anterior.
let pfCepSeq=0;
async function pfCep(raw){
 const cep=raw.replace(/\D/g,''),msg=$('#pf-cep-msg'),f=pfEl();if(cep.length!==8)return;
 const seq=++pfCepSeq;msg.textContent='Buscando endereço…';msg.className='';
 let a=null;
 try{const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');const j=await r.json();if(r.ok&&!j.erro)a={street:j.logradouro,district:j.bairro,city:j.localidade,uf:j.uf}}catch{}
 if(!a)try{const r=await fetch('https://brasilapi.com.br/api/cep/v1/'+cep);if(r.ok){const j=await r.json();a={street:j.street,district:j.neighborhood,city:j.city,uf:j.state}}}catch{}
 if(seq!==pfCepSeq||!f.elements.cep)return;
 if(!a){msg.textContent='Não encontramos esse CEP. Confira os números ou preencha o endereço abaixo.';msg.className='is-bad';return}
 for(const k of ['street','district','city','uf']){const el=f.elements[k];if(a[k]&&(!el.value||el.dataset.auto)){el.value=a[k];el.dataset.auto='1'}}
 msg.textContent=a.street?'Endereço encontrado. Confira e informe o número.':'CEP da cidade inteira: informe rua e bairro.';msg.className='is-ok';
 (a.street?(f.elements.noNumber.checked?f.elements.complement:f.elements.number):f.elements.street).focus();
}
async function pfPhoto(file){
 const box=$('#pf-photo');if(!file)return;
 if(!file.type.startsWith('image/')){toast('Escolha um arquivo de imagem.');return}
 try{
  const img=await createImageBitmap(file),max=960,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.72);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',.72);
  pfEl().elements.photo.value=url;box.classList.add('has-photo');
  box.querySelector('.pf-photo-prev')?.remove();
  box.insertAdjacentHTML('beforeend','<div class="pf-photo-prev"><img src="'+url+'" alt="Foto da fachada escolhida"><div><label for="pf-file" class="pf-photo-btn">Trocar foto</label><button type="button" class="pf-photo-btn" data-pf-rm>Remover</button></div></div>');
 }catch{toast('Não foi possível ler esta imagem. Tente outra foto.')}
}
function pfData(f){
 const g=n=>(f.get(n)||'').toString().trim(),num=n=>g(n)===''?null:Number(g(n));
 const noNumber=!!f.get('noNumber'),number=noNumber?'S/N':g('number'),cep=g('cep').replace(/\D/g,'');
 const street=[g('street'),number].filter(Boolean).join(', ')+(g('complement')?' · '+g('complement'):'');
 return {name:g('name'),type:g('type'),purpose:g('purpose')||'Residencial',area:num('area'),bedrooms:num('bedrooms'),bathrooms:num('bathrooms'),parking:num('parking'),furnished:!!f.get('furnished'),pets:!!f.get('pets'),registry:g('registry'),photo:g('photo'),
  cep:cep.slice(0,5)+'-'+cep.slice(5),street:g('street'),number,noNumber,complement:g('complement'),district:g('district'),city:g('city'),uf:g('uf'),reference:g('reference'),
  address:street+' – '+g('district')+', '+g('city')+'/'+g('uf'),
  rent:pfCents(g('rent')),condo:pfCents(g('condo')),iptu:pfCents(g('iptu')),payer:g('payer')||'Locatário'};
}
document.addEventListener('input',e=>{
 const t=e.target;if(!t.closest?.('.pf-step'))return;
 if(t.name==='cep'){const d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;if(d.length===8)pfCep(d);else{$('#pf-cep-msg').textContent='Digite o CEP para preencher o endereço.';$('#pf-cep-msg').className=''}}
 if(['street','district','city'].includes(t.name))delete t.dataset.auto;
 if(['rent','condo','iptu'].includes(t.name))pfTotals();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(action==='lease'&&t.name==='property'){const p=db.properties.find(x=>x.id===t.value),am=$('#form [name=amount]');if(p?.rent&&am&&!am.value)am.value=(p.rent/100).toFixed(2)}
 if(!t.closest?.('.pf-step'))return;
 if(t.id==='pf-file'){pfPhoto(t.files[0]);t.value=''}
 if(t.name==='type'){const p=pfEl().querySelector('[name=purpose][value="'+(pfBusiness.includes(t.value)?'Comercial':'Residencial')+'"]');if(p)p.checked=true}
 if(t.name==='noNumber'){const n=pfEl().elements.number;n.disabled=t.checked;n.required=!t.checked;if(t.checked)n.value='';else n.focus()}
 if(t.name==='payer')pfTotals();
 if(t.name==='uf')delete t.dataset.auto;
});
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-pf-go]'),back=e.target.closest('[data-pf-back]'),rm=e.target.closest('[data-pf-rm]');
 if(go){const n=+go.dataset.pfGo;for(let i=pfStep;i<n;i++)if(!pfCheck(i))return;pfGo(n)}
 if(back)pfGo(pfStep-1);
 if(rm){pfEl().elements.photo.value='';$('#pf-photo').classList.remove('has-photo');$('#pf-photo .pf-photo-prev')?.remove();$('#pf-photo .pf-photo-add').focus()}
});

 return '<div class="pl-grid">'+db.properties.map(p=>{
  const l=db.leases.find(l=>l.property===p.id&&l.start<=now&&l.end>=now),who=l&&db.people.find(x=>x.id===l.person)?.name;

 $('#formTitle').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';$('#form > .primary').hidden=type==='account'&&!!auth||type==='property';$('#form').noValidate=type==='property';$('dialog').classList.toggle('dlg-wide',type==='property');$('#form > .primary').textContent=type==='account'?'Entrar':'Salvar';if(!$('dialog').open)$('dialog').showModal();if(type==='property')pfGo(0);

function exportFinance(){const moves=[...db.payments.map(p=>({...p,name:pname(db.leases.find(l=>l.id===p.key.split('/')[0])?.property),type:'Aluguel'})),...db.expenses.map(e=>({...e,amount:-e.amount,type:'Despesa'}))].filter(x=>x.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));const csv=['Data,Descrição,Tipo,Valor (centavos)',...moves.map(x=>[x.date,'"'+String(x.name||'').replaceAll('"','""')+'"',x.type,x.amount].join(','))].join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));link.download='alugafacil-financeiro-'+month+'.csv';link.click();URL.revokeObjectURL(link.href);toast('Arquivo CSV preparado.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b?.dataset.act==='exportFinance')exportFinance();else if(b)open(b.dataset.act)});
document.addEventListener('change',e=>{if(e.target.id==='month'&&/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render()}if(e.target.id==='filter'){filter=e.target.value;render()}});
$('#wallet').onchange=e=>walletChange(e.target.value);$('#switch').onclick=()=>open('wallet');$('#close').onclick=()=>$('dialog').close();addEventListener('hashchange',render);addEventListener('storage',e=>{if(wallet!=='cloud'&&e.key===key()&&!$('dialog').open){read();render()}});read();render();
