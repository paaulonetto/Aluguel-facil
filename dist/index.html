<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7C5A">
  <title>AlugaFácil · Gestão de aluguéis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <aside>
    <a class="brand" href="#Painel"><img src="/logotipo-cor.svg" alt="AlugaFácil"></a>
    <small>ÁREA DO LOCADOR</small>
    <nav id="nav"></nav>
    <footer><label>Carteira ativa<select id="wallet"><option value="demo">Demonstração</option><option value="real">Minha carteira local</option><option value="cloud">Carteira online (Supabase)</option></select></label></footer>
  </aside>
  <main>
    <header><span>Minha gestão &nbsp; / &nbsp; <strong id="crumb">Painel</strong></span><button id="switch" class="plain">Carteira</button></header>
    <section id="view"></section>
  </main>
  <nav id="tabbar" class="af-tabbar" aria-label="Navegação principal"></nav>
  <dialog><form id="form"><div class="row"><h2 id="formTitle"></h2><button type="button" id="close" aria-label="Fechar">×</button></div><div id="fields"></div><p id="error" role="alert"></p><button class="primary">Salvar</button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
